
name: IoT Data Platform CI

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select checks to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - unit
          - daily
          - integration
          - quality

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    env:
      TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_suite || 'all' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        if: env.TEST_SUITE == 'all' || env.TEST_SUITE == 'quality'
        run: ruff check .

      - name: Ruff format check
        if: env.TEST_SUITE == 'all' || env.TEST_SUITE == 'quality'
        run: ruff format --check .

      - name: Run unit tests
        if: env.TEST_SUITE == 'all' || env.TEST_SUITE == 'unit'
        run: |
          pytest src/iot_platform/tests/units \
            --cov=iot_platform \
            --cov-report=term-missing

      - name: Run daily tests
        if: env.TEST_SUITE == 'daily'
        run: pytest src/iot_platform/tests/units -m daily

      - name: Run integration tests
        if: env.TEST_SUITE == 'all' || env.TEST_SUITE == 'integration'
        shell: bash
        run: |
          if [ -d tests/integration ] && \
             find tests/integration -type f \
             \( -name "test_*.py" -o -name "*_test.py" \) \
             -print -quit | grep -q .; then
            pytest tests/integration
          else
            echo "No integration tests found. Skipping."
          fi
